[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-routing-friction-resolver"
version = "1.0.0"
description = "Logistics router that prices edges with haversine friction and solves the lowest-cost path with Dijkstra."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TechieGoku2623" }]
dependencies = []

[project.optional-dependencies]
dev = ["black==24.8.0", "flake8==7.1.1"]

[project.scripts]
spatial-routing-friction-resolver = "spatial_routing_friction_resolver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
